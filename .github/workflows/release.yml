name: Test and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: penpot-bridge-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build plugin and run tests
        shell: pwsh
        run: |
          node build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-isolation=none tests/bridge.test.mjs tests/exporter.test.mjs tests/cloud.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package source and portable Windows helper
        run: python scripts/release.py --windows
      - name: Publish new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view $releaseTag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $releaseTag already exists; keeping it unchanged."; exit 0 }
          $releaseAssets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $releaseTag @releaseAssets --title "Penpot Bridge $releaseTag" --notes-file RELEASE-NOTES.md --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
