<!doctype html><html><head><meta charset="utf-8"><title>Penpot Bridge · Companion preview</title><style>body{margin:0;background:#25282a;color:#e9eeeb;font:12px/1.5 system-ui}aside{position:fixed;left:20px;top:20px;width:210px}button{display:block;padding:9px 12px;margin:10px 0;width:100%;border:1px solid #5d685f;border-radius:7px;background:#303933;color:inherit;cursor:pointer}iframe{display:block;width:624px;height:860px;border:1px solid #404840;border-radius:10px;margin:20px auto}pre{white-space:pre-wrap;font-size:11px;max-height:450px;overflow:auto}body:has(iframe[style]) iframe{margin-top:20px}</style></head><body><aside><strong>Local companion preview</strong><p>Synthetic selection. Real companion, image processing and portable bundle. No upload credentials.</p><button id="checks">Run interface checks</button><button id="error">Fail next preparation</button><button id="short">Short panel</button><button id="normal">Normal panel</button><pre id="results">Ready</pre></aside><iframe title="Penpot companion" src="/ui.html"></iframe><script>
const frame=document.querySelector('iframe');let fail=false;const root={id:'root',name:'Machine Upgrades',type:'group',x:0,y:0,width:320,height:180,children:[{id:'title',name:'Upgrade your factory…',type:'text',x:20,y:10,width:280,height:30,fontWeight:700,children:[]},{id:'panel',name:'Upgrade panel background',type:'frame',x:0,y:40,width:96,height:64,radius:12,radii:[12,12,12,12],rasterSurface:true,assetKey:'panel-art',children:[]},{id:'button',name:'UpgradeButton',type:'frame',x:120,y:40,width:96,height:64,radius:12,radii:[12,12,12,12],rasterSurface:true,assetKey:'button-art',children:[]}]};
const assets=[{key:'panel-art',shapeId:'panel',name:'Upgrade panel background'},{key:'button-art',shapeId:'button',name:'Upgrade button background'}];
window.addEventListener('message',async e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;const m=e.data,send=value=>frame.contentWindow.postMessage({...value,requestId:m.requestId},location.origin);
 if(m.type==='layers'){const layers=[];const visit=(n,depth)=>{layers.push({id:n.id,name:n.name,type:n.type,depth,sourceWeight:n.fontWeight});n.children.forEach(c=>visit(c,depth+1))};visit(root,0);send({type:'layer-list',fileId:'companion-preview-fixture',layers})}
 if(m.type==='export'){if(fail){fail=false;send({type:'error',message:'Fixture export failed. Your selection has not been changed.'});return}send({type:'document',document:{format:'penpot-roblox',version:6,source:{fileId:'companion-preview-fixture',rootId:'root'},design:structuredClone(root),assets:structuredClone(assets),options:{autoTint:false},warnings:[]}})}
 if(m.type==='assets'){const bytes=Array.from(new Uint8Array(await(await fetch('/fixture.png')).arrayBuffer()));send({type:'assets',assets:assets.map(a=>({...a,bytes,viewBox:[0,0,96,64],shapeWidth:96,shapeHeight:64}))})}
});
document.querySelector('#error').onclick=()=>{fail=true;document.querySelector('#results').textContent='Next Prepare selection will return an error.'};
document.querySelector('#short').onclick=()=>frame.style.height='540px';document.querySelector('#normal').onclick=()=>frame.style.height='860px';
document.querySelector('#checks').onclick=async()=>{const d=frame.contentDocument,results=[],appearance=d.querySelector('#appearance'),previous=appearance.value,current=d.querySelector('[data-page][aria-current=page]');const check=(name,fn)=>{try{fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}};
 for(const theme of ['dark','light']){appearance.value=theme;appearance.dispatchEvent(new Event('change'));for(const page of ['transfer','layers','images','settings','connection']){d.querySelector('[data-page='+page+']').click();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));check(theme+' / '+page,()=>{const visible=[...d.querySelectorAll('[data-view]')].filter(v=>!v.hidden);if(visible.length!==1||visible[0].dataset.view!==page)throw Error('Navigation did not isolate page');const shell=d.querySelector('.app-shell'),workspace=d.querySelector('.workspace');if(Math.round(shell.getBoundingClientRect().width)!==624)throw Error('Desktop width changed');if(workspace.scrollWidth>workspace.clientWidth+1)throw Error('Content overflowed horizontally');if(d.querySelector('footer'))throw Error('Empty footer returned');const text=getComputedStyle(d.querySelector('h1')).color;if(text!==(theme==='dark'?'rgb(243, 245, 244)':'rgb(27, 34, 29)'))throw Error('Title contrast incorrect')})}}
 appearance.value=previous;appearance.dispatchEvent(new Event('change'));current.click();document.querySelector('#results').textContent=JSON.stringify({passed:results.filter(r=>r.passed).length,total:results.length,results},null,2);
};
</script></body></html>
