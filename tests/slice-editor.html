<!doctype html><html><head><meta charset="utf-8"><title>Penpot Bridge · Slice editor checks</title><link rel="stylesheet" href="/ui.css">
<style>body{max-width:760px;margin:auto;padding:24px}#image-controls{margin-top:20px}#results{white-space:pre-wrap}.tools{display:flex;flex-wrap:wrap;gap:10px}.tools button{padding:9px;border-radius:6px}#image-controls{width:100%}#image-controls .card{overflow-wrap:anywhere}</style>
</head><body><h1>Nine-slice editor</h1><p class="muted">Local sample artwork. No Studio, Penpot, helper or upload key required.</p>
<div class="tools"><button id="run">Run regression checks</button><button id="narrow">Narrow panel</button><button id="wide">Wide panel</button><button id="theme">Switch appearance</button></div>
<pre id="results">Loading fixture…</pre><p id="status" aria-live="polite"></p><div id="image-controls"></div>
<script src="/image-editor.js"></script><script>
let editor,doc,busy=false,posts=0,ready=false;
const status=document.getElementById('status'),results=document.getElementById('results'),container=document.getElementById('image-controls');
const base64=bytes=>btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
async function setup(){
 editor?.destroy();posts=0;ready=true;
 const bytes=new Uint8Array(await(await fetch('/assets/fixture/png')).arrayBuffer());
 doc={design:{id:'panel',name:'Sample panel',type:'frame',width:96,height:64,radius:12,radii:[12,12,12,12],children:[]},assets:[{key:'art',shapeId:'panel',name:'Sample panel'}],options:{autoTint:false}};
 editor=await P2RImageEditor.create(doc,[{...doc.assets[0],bytes,viewBox:[0,0,96,64],shapeWidth:96,shapeHeight:64}],{
  token:'fixture-only',base64,status:s=>status.textContent=s,dirty:s=>{ready=false;status.textContent=s},ready:()=>ready=true,busy:()=>busy,
  processing:value=>{busy=value;for(const e of container.querySelectorAll('input,button')){if(value)e.dataset.wasDisabled=String(e.disabled);e.disabled=value||e.dataset.wasDisabled==='true'}},
  request:async()=>{posts++;return {hash:'fixture',width:192,height:128,bounds:{x:0,y:0,width:96,height:64}}}
 });
}
const state=()=>editor.states[0],guides=()=>Array.from(container.querySelectorAll('.slice-guide'));
const change=(e,type='input')=>e.dispatchEvent(new Event(type,{bubbles:true}));
const key=(e,key,shiftKey=false)=>e.dispatchEvent(new KeyboardEvent('keydown',{key,shiftKey,bubbles:true,cancelable:true}));
const values=()=>state().edges.map(e=>Number(e.value));
const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const check=(condition,message)=>{if(!condition)throw Error(message)};
document.getElementById('run').onclick=async()=>{
 const findings=[];await setup();
 const test=async(name,fn)=>{try{await fn();findings.push({name,passed:true})}catch(e){findings.push({name,passed:false,error:e.message})}};
 await test('Slicing stays opt-in, with disabled guides and visible source pixels',()=>{check(!state().slice.checked&&!doc.design.slice,'unexpected default slice');check(guides().every(e=>e.disabled)&&state().edges.every(e=>e.disabled),'controls enabled before opt-in');const source=container.querySelector('.slice-stage canvas'),pixel=source.getContext('2d').getImageData(0,0,1,1).data;check(equal(Array.from(pixel),[255,195,74,255]),'source artwork missing or incorrect')});
 await test('Corner suggestion synchronizes fields, guides and pending state',()=>{Array.from(container.querySelectorAll('button')).find(e=>e.textContent==='Suggest slices from source corners').click();check(equal(values(),[24,24,24,24]),'wrong source-pixel suggestion');check(guides()[0].getAttribute('aria-valuenow')==='24','guide not updated');check(!ready&&!doc.design.slice,'draft committed before Apply')});
 await test('Numeric edits update guide geometry and live preview without a request',()=>{const before=container.querySelector('.image-previews canvas').toDataURL(),count=posts;state().edges[0].value='8';change(state().edges[0]);check(Math.abs(parseFloat(guides()[0].style.left)-100*8/192)<.001,'guide offset wrong');check(before!==container.querySelector('.image-previews canvas').toDataURL(),'preview did not change');check(posts===count&&!doc.design.slice,'editing performed an upload or committed the draft')});
 await test('Arrow/Shift keys use source pixels and respect right/bottom direction',()=>{key(guides()[0],'ArrowRight');key(guides()[0],'ArrowRight',true);key(guides()[2],'ArrowLeft');key(guides()[3],'ArrowUp',true);check(equal(values(),[19,24,25,34]),'keyboard direction or step wrong: '+values())});
 await test('Guides clamp before crossing and at image bounds',()=>{key(guides()[0],'End');check(values()[0]+values()[2]===191,'guides crossed');key(guides()[0],'Home');key(guides()[0],'ArrowLeft');check(values()[0]===0,'negative inset')});
 await test('Invalid/empty numeric fields fail before processing pixels',async()=>{state().edges[0].value='192';change(state().edges[0]);const count=posts;await Array.from(container.querySelectorAll('button')).find(e=>e.textContent==='Apply image settings').onclick();check(posts===count&&!ready,'invalid settings reached image processing');check(/overlap|outside/.test(status.textContent),'no validation message');state().edges[0].value='';change(state().edges[0]);check(container.querySelector('.slice-note').classList.contains('invalid'),'empty field not flagged')});
 await test('Apply stores expected source rectangle and scale; source pixels unchanged',async()=>{state().edges.forEach((e,i)=>{e.value=[20,16,28,24][i];change(e)});await Array.from(container.querySelectorAll('button')).find(e=>e.textContent==='Apply image settings').onclick();check(equal(doc.design.slice,{rect:[20,16,164,104],scale:.5}),'incorrect committed slice');check(ready&&!state().dirty,'apply did not clear pending state');check(guides().every(e=>!e.disabled),'guides stayed disabled after processing')});
 await test('Panel resizing preserves source-pixel values and guide proportions',()=>{const original=container.style.width;container.style.width='240px';const bounds=container.querySelector('.slice-stage').getBoundingClientRect();check(bounds.width<=210,'narrow stage overflowed');check(equal(values(),[20,16,28,24]),'resize altered slice');check(Math.abs(parseFloat(guides()[2].style.left)-100*164/192)<.001,'right guide proportion changed');container.style.width=original});
 await test('Disabling and applying removes slicing; controls stay disabled',async()=>{state().slice.checked=false;change(state().slice,'change');await Array.from(container.querySelectorAll('button')).find(e=>e.textContent==='Apply image settings').onclick();check(!doc.design.slice&&ready,'slicing not removed');check(guides().every(e=>e.disabled)&&state().edges.every(e=>e.disabled),'disabled slicing left controls active')});
 await test('Linked borders synchronize in either direction without linking the other axis',()=>{state().slice.checked=true;change(state().slice,'change');state().edges.forEach((e,i)=>{e.value=[20,16,28,24][i];change(e)});const links=container.querySelectorAll('.slice-actions input');links[0].checked=true;change(links[0],'change');check(equal(values(),[20,16,20,24]),'enabling did not match Right to Left');state().edges[2].value=30;change(state().edges[2]);key(guides()[2],'ArrowLeft');check(equal(values(),[31,16,31,24]),'right edits did not update left or changed vertical axis');links[1].checked=true;change(links[1],'change');check(equal(values(),[31,16,31,16]),'vertical link did not match Bottom to Top')});
 await test('Linked bounds keep a nonempty center; unlinking preserves values and independence',()=>{const links=container.querySelectorAll('.slice-actions input');state().edges[3].value=100;change(state().edges[3]);check(equal(values(),[31,63,31,63]),'linked numeric values crossed');key(guides()[3],'ArrowUp',true);check(values()[1]===63&&values()[3]===63,'linked keyboard values crossed');links[0].checked=false;change(links[0],'change');check(values()[0]===31&&values()[2]===31,'unlink changed geometry');state().edges[2].value=14;change(state().edges[2]);check(values()[0]===31&&values()[2]===14,'unlink did not restore independent editing')});
 await test('Reset changes only slice guides, keeps links and styling, and requires Apply',async()=>{const links=container.querySelectorAll('.slice-actions input');links[0].checked=true;change(links[0],'change');await Array.from(container.querySelectorAll('button')).find(e=>e.textContent==='Apply image settings').onclick();const committed=JSON.stringify(doc.design.slice),count=posts;state().tint.checked=true;state().dilate.checked=true;state().glow.checked=true;state().radius.value='13';state().glowOpacity.value='.4';state().glowColor.value='#ff8844';Array.from(container.querySelectorAll('button')).find(e=>e.textContent==='Reset slice guides').click();check(equal(values(),[0,0,0,0]),'reset did not clear guides');check(state().slice.checked&&Array.from(links).every(e=>e.checked),'reset disabled slicing or links');check(state().tint.checked&&state().dilate.checked&&state().glow.checked&&state().radius.value==='13'&&Number(state().glowOpacity.value)===.4&&state().glowColor.value==='#ff8844','reset altered another image setting');check(!ready&&state().dirty&&posts===count&&JSON.stringify(doc.design.slice)===committed,'reset committed or processed before Apply');state().tint.checked=false;state().dilate.checked=false;state().glow.checked=false});
 results.textContent=JSON.stringify({passed:findings.filter(v=>v.passed).length,total:findings.length,findings},null,2);
 // Leave a useful sample for actual pointer interaction after the checks.
 state().edges.forEach(e=>e.value=24);state().slice.checked=true;change(state().slice,'change');
};
document.getElementById('narrow').onclick=()=>container.style.width='280px';
document.getElementById('wide').onclick=()=>container.style.width='100%';
document.getElementById('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';
setup().then(()=>results.textContent='Ready. Run regression checks, or enable nine-slice scaling to try the guides.').catch(e=>results.textContent=e.stack);
</script></body></html>
